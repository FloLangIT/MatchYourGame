      Description: "**Matching lobby found · 4/5 players**\nGame: your selected mode\nPlatform, region, rank, and language match your profile.\n\n• TutorialQueue01 · Host\n• TutorialQueue02\n• TutorialQueue03\n• TutorialQueue04\n\nIn normal operation you could accept or decline. Accepting would fill the lobby and prepare the voice channel.\n\n**You are ready.** Adjust profiles under **Game profiles**, create groups under **Party**, and use **Crews** for persistent groups with members and shared games. The next button turns this message into your normal pinned management message."
