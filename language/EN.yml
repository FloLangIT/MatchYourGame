      FriendAccepted: "**Tutorial123** was invited and accepted automatically.\n\nNext, invite the example crew **TutorialClan**."
      InviteClan: "Invite TutorialClan"
      ClanPending: "Two crew invitations were sent. The lobby remains at 2/5 until an invited user accepts."
