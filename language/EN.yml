NewGuild:
  NoAccountYet:
    title: "MatchYourGame joined your guild!"
    description: "Welcome to MatchYourGame!\nThe bot was added to **%guildName%**\n\nCurrently you didn't have an account yet. Please create one by using the button below, or transfer managing to someone else.\nIf you transfer managing, you will never have access to the guild admin panel.\n\nIf more than 30 users registered by your sign up button in discord channel, you will receive an invite to your our partner program."
    Button:
      TransferManage: "Transfer guild manage"
  SetupGuild:
    title: "MatchYourGame joined your guild!"
    description: "Welcome to MatchYourGame!\nThe bot was added to **%guildName%**\n\nYou need to setup your guild before the bot can be used by your users.\n\nPlease use the button below to setup your guild."
    Button: "Setup guild"
    Modal:
      Title: "Setup %guildName%"
      Language: "Guild language"
    VoiceCategory: "🤝・MYG Voice・🤝"
    CreateProfileChannel: "┃👤┃create-profile"
  SetupCompleted:
    title: "Setup completed"
    description: "Your guild is done! Your users can now create accounts on your guild %textChannel% and connect with other players.\n\nAfter %partnerGuildUserCount% User creates an account on your guild, your guild could be used for voice channel, if you want.\nThis condition could be changed. We will inform you about something like that.\n\nJoin the **Bearhell Discord** to get MatchYourGame Support and stay up to date. %discordInvite%"
  MissingPermissions:
    title: "Missing permissions"
    description: "The bot has not enough permissions to setup this guild.\n\nThe bot need MANAGE_CHANNEL and SEND_MESSAGE permission."
  GuildNotFound:
    title: "Guild not found!"
    description: "The guild you are trying to setup was not found.\nMake sure the bot is in the guild you want to setup."

CreateUser:
  title: "Find your perfect match"
  description: "Create your account for MatchYourGame to find perfect matches.\n\nMake sure the bot can send private messages to you.\nAfter creation, you can do anything over DM Chat with the bot."
  Button: "Create account"
  Modal:
    Title: "Create MatchYourGame account"
    Username: "Username"
    Language: "Language"
  AccountCreated:
    title: "Account successfully created!"
    description: "You can now use the bot in your private chat."
  PrivateChatDisable:
    title: "Private chat disabled!"
    description: "Please enable private chat in your privacy settings, the bot need to send you messages."
  YouAlreadyHaveAccount:
    title: "You already have an account!"
    description: "Use private chat to manage your account settings."

UserProfile:
  title: "Your MYG profile"
  description: "User ID: %userId%\nUsername: %username%\nCreated at: %createdAt%"
  Button:
    EditProfile: "Edit profile"
    PassiveQ: "PassiveQ configuration"
    CreateLobby: "Create lobby"
    Friends: "Friends"
    Crews: "Crews"
    Back: "Back to main page"
  Friends:
    title: "Your friends"
    description: "Here your can manage your friends!"
    Button:
      AddFriend: "Add friend"
    AddFriend:
      Modal:
        Title: "Add friend"
        Username: "Friend's username"
      CantAddSelf:
        title: "You can't add your self"
        description: "There is no reason to be friend with your self buddy. Try passiveQ or create a lobby."
      AlreadyAdded:
        title: "Already send friend request"
        description: "You have already sent a friend request to %username%."
      AlreadyFriends:
        title: "%username% is already your friend"
        description: "You can't add the same person two times."
      RequestSent:
        title: "Request sent"
        description: "The friend request to %username% was sent."

FriendRequest:
  RequestReceive:
    title: "You received a friend request from **%requester%**"
    description: "**%requester%** sent you a friend request./n/nUse the buttons below to answer this request.\nIf you use the ignore button, the message will be deleted but **%requester%** won't be informed."
    Button:
      Accept: "Accept"
      Deny: "Deny"
      Ignore: "Ignore"
  AcceptRequest:
    title: "Friend request accepted from **%receiver%**"
    description: "**%receiver%** accepted your friend request from %timestamp%."
  ConfirmAcceptToReceiver:
    title: "You are now friends with **%requester%**"
    description: "You can now see actions from **%requester%** on the friends page, and easy invite to your lobbies or crews."

General:
  NoUserWithUsername:
    title: "There is no user"
    description: "There is no user with the username %username% registered on MatchYourGame. Check for typos. And use the button again."
  Button:
    DeleteMessage: "Delete message"
