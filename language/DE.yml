Tutorial:
  Title: "Willkommen bei MatchYourGame"
  Description: "**1. Profil einrichten**\nÖffne deine angepinnte Management-Nachricht. Lege unter **Spielprofile** für jedes Spiel Plattform, Region und – falls benötigt – Rang und Rolle fest. Unter **Profil bearbeiten** verwaltest du Namen, Nachrichten- und Kommunikationssprachen.\n\n**2. Freunde, Crews und Partys**\nFüge Freunde hinzu und bilde vor einer Lobby eine Party. Nur der Party-Host erstellt oder betritt eine Lobby und nimmt alle Mitglieder mit. In Crews kannst du Mitglieder und gemeinsame Spiele verwalten.\n\n**3. Eine Lobby finden**\nErstelle selbst eine Lobby oder aktiviere die **PassiveQ** für konfigurierte Spielprofile. PassiveQ-Einladungen werden passend zu Spiel, Plattform, Region, Rang, Sprachen und bisherigen Bewertungen verteilt. Direkte Einladungen sind nur zwischen Freunden möglich.\n\n**4. Lobby und Voice-Channel**\nIst die Lobby voll, erstellt MatchYourGame auf einer passenden Partner-Guild einen privaten Voice-Channel. Tritt innerhalb der angezeigten Frist bei. Nach dem Start werden Verlassen und Wiederbeitrittsfristen automatisch verwaltet.\n\n**5. Nach dem Spielen**\nDer Host trägt jedes gespielte Match ein. Die anderen Spieler bestätigen die Ergebnisse. Anschließend erhältst du gegebenenfalls eine zufällige Spielerbewertung; manuelle Bewertungen sind nicht möglich.\n\n**6. Hilfe und Sicherheit**\nÜber **Report / Feedback** meldest du Spieler, Bugs oder sendest Feedback. Verwende jederzeit `/tutorial`, um diese Anleitung erneut als DM zu erhalten."
  Sent: "Das Tutorial wurde dir per DM geschickt."
  NoAccount: "Du benötigst zuerst einen MatchYourGame-Account."
