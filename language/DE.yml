NewGuild:
  NoAccountYet:
    title: "MatchYourGame ist deiner Guild beigetreten!"
    description: "Willkommen bei MatchYourGame!\nDer Bot wurde zu **%guildName%** hinzugefügt.\n\nDu besitzt aktuell noch keinen Account. Erstelle über den Button einen Account oder übertrage die Guild-Verwaltung an eine andere Person.\nWenn du die Verwaltung überträgst, erhältst du keinen Zugriff auf die Guild-Verwaltung.\n\nSobald sich genügend Nutzer über den Registrierungs-Channel deiner Guild angemeldet haben, kann deine Guild am Partnerprogramm teilnehmen."
    Button:
      TransferManage: "Guild-Verwaltung übertragen"
  SetupGuild:
    title: "MatchYourGame ist deiner Guild beigetreten!"
    description: "Willkommen bei MatchYourGame!\nDer Bot wurde zu **%guildName%** hinzugefügt.\n\nBevor deine Mitglieder den Bot verwenden können, muss die Guild eingerichtet werden.\n\nNutze dafür den Button unter dieser Nachricht."
    Button: "Guild einrichten"
    Modal:
      Title: "%guildName% einrichten"
      Language: "Guild-Sprache"
    VoiceCategory: "🤝・MYG Voice・🤝"
    CreateProfileChannel: "┃👤┃create-profile"
  SetupCompleted:
    title: "Einrichtung abgeschlossen"
    description: "Deine Guild ist eingerichtet. Mitglieder können jetzt über %textChannel% Accounts erstellen und andere Spieler finden.\n\nNachdem %partnerGuildUserCount% Nutzer über deine Guild einen Account erstellt haben, kann sie auf Wunsch als Partner-Guild für Voice-Channels verwendet werden. Falls sich diese Voraussetzung ändert, informieren wir dich.\n\nTritt dem **Bearhell Discord** bei, um MatchYourGame-Support und Neuigkeiten zu erhalten: %discordInvite%"
  MissingPermissions:
    title: "Fehlende Berechtigungen"
    description: "Der Bot besitzt nicht genügend Berechtigungen, um diese Guild einzurichten.\n\nBenötigt werden **Kanäle verwalten** und **Nachrichten senden**."
  GuildNotFound:
    title: "Guild nicht gefunden"
    description: "Die einzurichtende Guild wurde nicht gefunden.\nStelle sicher, dass sich der Bot weiterhin auf dieser Guild befindet."

